{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="section-padding login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <h2 class="login-title">👑 Acceso Administrador</h2>
                        <p class="text-muted">Ingresa tus credenciales para gestionar MM Studio</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" name="username" class="form-control" id="username" placeholder="mmstudio" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                ❌ Usuario o contraseña incorrectos
                            </div>
                        {% endif %}
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">
                            🔐 Iniciar sesión
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .login-section {
        background: #f8f9fa;
        min-height: 80vh;
        display: flex;
        align-items: center;
    }
    
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    
    .login-title {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--texto-oscuro);
    }
</style>

{% endblock %}
